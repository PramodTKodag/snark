networks:
  snark:
    name: snark
    driver: bridge

volumes:
  snark-postgres-data:
  snark-redis-data:
  snark-loki-data:
  snark-grafana-data:
  snark-prometheus-data:

services:
  snark-postgres:
    image: postgres:16-alpine
    container_name: snark-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snark}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - snark-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-snark}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles:
      - dev
      - prod
    networks:
      - snark

  snark-redis-cache:
    image: redis:7-alpine
    container_name: snark-redis-cache
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - snark-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev
      - prod
    networks:
      - snark

  wit-dev:
    build: .
    container_name: snark
    ports:
      - "${WIT_PORT:-8100}:${INTERNAL_PORT:-8094}"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      snark-postgres:
        condition: service_healthy
      snark-redis-cache:
        condition: service_healthy
    command: >
      sh -c "cd snark &&
             python manage.py migrate &&
             python manage.py ensure_admin &&
             python manage.py prune_logs &&
             python manage.py seed_personas &&
             python manage.py runserver 0.0.0.0:$$INTERNAL_PORT"
    profiles:
      - dev
    networks:
      - snark

  wit-prod:
    build: .
    container_name: snark
    ports:
      - "${WIT_PORT:-8100}:${INTERNAL_PORT:-8094}"
    env_file:
      - ./.env
    depends_on:
      snark-postgres:
        condition: service_healthy
      snark-redis-cache:
        condition: service_healthy
    command: >
      sh -c "export PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus &&
             mkdir -p /tmp/prometheus &&
             cd snark &&
             python manage.py migrate &&
             python manage.py ensure_admin &&
             python manage.py prune_logs &&
             python manage.py seed_personas &&
             gunicorn base.wsgi:application --bind 0.0.0.0:$$INTERNAL_PORT
             --config /app/observability/gunicorn.conf.py
             --workers $${GUNICORN_WORKERS:-2} --threads $${GUNICORN_THREADS:-8}
             --max-requests 1000 --max-requests-jitter 100"
    volumes:
      - ./observability/gunicorn.conf.py:/app/observability/gunicorn.conf.py:ro
    tmpfs:
      - /tmp/prometheus
    profiles:
      - prod
    networks:
      - snark

  loki:
    image: grafana/loki:3.2.0
    container_name: snark-loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - snark-loki-data:/loki
    restart: unless-stopped
    profiles:
      - observability
    networks:
      - snark

  alloy:
    image: grafana/alloy:v1.5.0
    container_name: snark-alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - observability
    networks:
      - snark

  grafana:
    image: grafana/grafana:11.4.0
    container_name: snark-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - snark-grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - observability
    networks:
      - snark

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: snark-prometheus
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
    entrypoint:
      - /bin/sh
      - -c
      - >
        printf '%s' "$${METRICS_AUTH_TOKEN}" > /tmp/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - snark-prometheus-data:/prometheus
    restart: unless-stopped
    profiles:
      - observability
    networks:
      - snark
